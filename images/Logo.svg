<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 90" width="480" height="90">


  <!-- ═══ D-DIAMOND MARK centred at x=46, y=45 ═══ -->
  <g transform="translate(46,45)">

    <!-- Ghost left half of diamond (dashed) — boosted from 0.16 → 0.55 -->
    <line x1="0" y1="-36" x2="-28" y2="0"  stroke="white" stroke-width="1" opacity="0.55" stroke-dasharray="2.5 4"/>
    <line x1="-28" y1="0" x2="0"  y2="36"  stroke="white" stroke-width="1" opacity="0.55" stroke-dasharray="2.5 4"/>

    <!-- Right half bow (the D shape) -->
    <line x1="0"  y1="-36" x2="38" y2="0"  stroke="white" stroke-width="2.8" stroke-linecap="round"/>
    <line x1="38" y1="0"   x2="0"  y2="36" stroke="white" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Vertical spine of D -->
    <line x1="0" y1="-36" x2="0" y2="36"   stroke="white" stroke-width="5" stroke-linecap="round"/>

    <!-- Inner facet: horizontal mid-line — boosted from 0.2 → 0.65 -->
    <line x1="0" y1="0" x2="38" y2="0" stroke="white" stroke-width="1" opacity="0.65"/>

    <!-- Facet fill triangles — boosted from 0.06/0.04 → 0.18/0.12 -->
    <polygon points="0,-36 38,0 0,0" fill="white" opacity="0.18"/>
    <polygon points="0,0 38,0 0,36"  fill="white" opacity="0.12"/>

    <!-- Vertex glow dots — top/bottom already good, left dot boosted 0.22 → 0.7 -->
    <circle cx="0"   cy="-36" r="3.5" fill="white" opacity="0.95"/>
    <circle cx="0"   cy="36"  r="3.5" fill="white" opacity="0.95"/>
    <circle cx="-28" cy="0"   r="2.2" fill="white" opacity="0.7"/>

    <!-- 4-point sparkle at right tip — already 0.95, kept -->
    <polygon points="38,-6.5 40.5,0 38,6.5 35.5,0" fill="white" opacity="0.95"/>
    <polygon points="31.5,0  38,-3  44.5,0 38,3"   fill="white" opacity="0.95"/>
    <!-- Bright dot at centre of sparkle -->
    <circle cx="38" cy="0" r="2.5" fill="white" opacity="1"/>

  </g>

  <!-- ═══ WORDMARK ═══ -->
  <text
    x="108" y="38"
    font-family="'Josefin Sans', 'Gill Sans', Arial, sans-serif"
    font-weight="300"
    font-size="22"
    fill="white"
    letter-spacing="7">DAZZLE</text>

  <!-- Thin rule — boosted from 0.18 → 0.55 -->
  <line x1="108" y1="47" x2="458" y2="47" stroke="white" stroke-width="0.7" opacity="0.55"/>

  <!-- CRYSTALS — boosted from #888 → #bbb -->
  <text
    x="110" y="61"
    font-family="'Josefin Sans', 'Gill Sans', Arial, sans-serif"
    font-weight="100"
    font-size="11"
    fill="#bbbbbb"
    letter-spacing="9">CRYSTALS</text>

  <!-- Floating sparkles top-right — boosted from 0.45 → 0.95, circles 0.3/0.22 → 0.75/0.65 -->
  <polygon points="442,18 443.2,22 442,26 440.8,22" fill="white" opacity="0.95"/>
  <polygon points="437,22 442,20.2 447,22 442,23.8"  fill="white" opacity="0.95"/>
  <circle cx="458" cy="38" r="1.5" fill="white" opacity="0.75"/>
  <circle cx="450" cy="58" r="1.2" fill="white" opacity="0.65"/>

</svg>

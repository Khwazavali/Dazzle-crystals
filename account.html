<!doctype html>
<html>
  <head>
    <title>Wishlist</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body class="orders-body">
    <header class="navbar">
      <div class="logo">
        <img src="images/Logo.svg" alt="Dazzle Crystals Logo" />
      </div>

      <nav>
        <a href="index.html#home">Home</a>
        <a href="index.html#products">Products</a>
        <a href="index.html#contact">Contact</a>
      </nav>

      <div class="nav-right">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="text"
            id="search-input"
            placeholder="Search crystals..."
          />
        </div>

        <button class="signin-btn" id="signin-btn">
          <i class="fa-regular fa-user"></i>

          <span id="signin-text">Sign In</span>
        </button>

        <div class="account-dropdown" id="account-dropdown">
          <a href="account.html">
            <i class="fa-regular fa-user"></i>
            <span>My Account</span>
          </a>

          <a href="wishlist.html">
            <i class="fa-regular fa-heart"></i>
            <span>Wishlist</span>
          </a>

          <a href="orders.html">
            <i class="fa-solid fa-box"></i>
            <span>Orders</span>
          </a>

          <button id="logout-btn">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Logout</span>
          </button>
        </div>

        <button class="menu-toggle" id="menu-toggle">☰</button>

        <a href="cart.html" class="cart">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count">0</span>
        </a>

        <div id="cart-message" class="cart-message"></div>
      </div>
    </header>

    <section class="orders-page">
      <div class="orders-header">
        <h1>My Account</h1>
      </div>

      <div id="account-container"></div>
    </section>

    <!-- =========================
     AUTH MODAL
========================= -->

    <div class="auth-overlay" id="auth-overlay">
      <div class="auth-modal">
        <!-- CLOSE BUTTON -->

        <button class="auth-close" id="auth-close">&times;</button>

        <!-- HEADER -->

        <div class="auth-header">
          <h2>Dazzle Crystals</h2>

          <p>Welcome back to your crystal collection.</p>
        </div>

        <!-- TABS -->

        <div class="auth-tabs">
          <button class="auth-tab active-tab" id="signin-tab">Sign In</button>

          <button class="auth-tab" id="signup-tab">Create Account</button>
        </div>

        <!-- SIGN IN FORM -->

        <form class="auth-form" id="signin-form">
          <input
            type="email"
            id="signin-email"
            placeholder="Email Address"
            required
          />

          <input
            type="password"
            id="signin-password"
            placeholder="Password"
            required
          />

          <button type="submit" class="auth-submit-btn">Sign In</button>
        </form>

        <!-- SIGN UP FORM -->

        <form class="auth-form hidden-form" id="signup-form">
          <input
            type="text"
            id="signup-firstname"
            placeholder="First Name"
            required
          />

          <input
            type="text"
            id="signup-lastname"
            placeholder="Last Name"
            required
          />

          <input
            type="email"
            id="signup-email"
            placeholder="Email Address"
            required
          />

          <input
            type="password"
            id="signup-password"
            placeholder="Password"
            required
          />

          <input
            type="password"
            id="signup-confirm-password"
            placeholder="Confirm Password"
            required
          />

          <button type="submit" class="auth-submit-btn">Create Account</button>
        </form>
      </div>
    </div>

    <!-- EDIT PROFILE MODAL -->

    <div class="profile-overlay" id="profile-overlay">
      <div class="profile-modal">
        <button class="profile-close" id="profile-close">&times;</button>

        <h2>Edit Profile</h2>

        <form class="profile-form">
          <input type="text" id="edit-firstname" placeholder="First Name" />

          <input type="text" id="edit-lastname" placeholder="Last Name" />

          <input type="email" id="edit-email" placeholder="Email" />

          <input type="text" id="edit-phone" placeholder="Phone Number" />

          <input type="text" id="edit-address" placeholder="Address" />

          <input type="text" id="edit-city" placeholder="City" />

          <input type="text" id="edit-state" placeholder="State" />

          <input type="text" id="edit-zipcode" placeholder="Zip Code" />

          <button type="button" id="save-profile-btn">Save Changes</button>
          <button type="button" id="change-password-btn" class="profile-btn">
            Change Password
          </button>
        </form>
      </div>
    </div>
    <div class="profile-overlay" id="password-overlay">
      <div class="profile-modal">
        <button class="profile-close" id="password-close">&times;</button>

        <h2>Change Password</h2>

        <div class="profile-form">
          <input
            type="password"
            id="current-password"
            placeholder="Current Password"
          />

          <input type="password" id="new-password" placeholder="New Password" />

          <input
            type="password"
            id="confirm-password"
            placeholder="Confirm New Password"
          />

          <button type="button" id="save-password-btn">Update Password</button>
        </div>
      </div>
    </div>

    <div class="mobile-bottom-nav">
      <a href="index.html">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>

      <a href="shop.html">
        <i class="fa-solid fa-store"></i>
        <span>Shop</span>
      </a>

      <a href="wishlist.html">
        <i class="fa-regular fa-heart"></i>
        <span>Wishlist</span>
      </a>

      <a href="cart.html" class="mobile-cart-link">
        <div class="mobile-cart-icon">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="mobile-cart-count">0</span>
        </div>

        <span>Cart</span>
      </a>

      <a href="account.html" class="active">
        <i class="fa-regular fa-user"></i>
        <span>Account</span>
      </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="js/account.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>

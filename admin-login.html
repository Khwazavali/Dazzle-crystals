
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Dazzle Crystals</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f6f3ef;
      font-family: Arial, sans-serif;
    }

    .login-container {
      width: 90%;
      max-width: 400px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #222;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #error-message {
      color: #b42318;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="login-container">
    <h1>Dazzle Crystals</h1>
    <p class="subtitle">Admin Portal</p>

    <form id="admin-login-form">
      <input
        type="email"
        id="admin-email"
        placeholder="Admin Email"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="admin-password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="login-button">
        Sign In
      </button>
    </form>

    <p id="error-message" role="alert"></p>
  </div>

  <script type="module" src="./js/admin-login.js"></script>

</body>
</html>
